<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Сокращатель ссылок</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 640px;
      margin: 60px auto;
      padding: 0 16px;
      color: #222;
    }
    h1 { font-size: 24px; margin-bottom: 20px; }
    .row { display: flex; gap: 8px; }
    input[type="text"] {
      flex: 1;
      padding: 10px 12px;
      font-size: 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    button {
      padding: 10px 18px;
      font-size: 15px;
      border: 0;
      border-radius: 6px;
      background: #2b6cb0;
      color: #fff;
      cursor: pointer;
    }
    button:hover { background: #245a94; }
    button:disabled { opacity: .6; cursor: default; }
    .msg { margin-top: 16px; font-size: 14px; }
    .msg.error { color: #c53030; }
    .result {
      margin-top: 24px;
      padding: 14px;
      background: #f5f7fa;
      border-radius: 8px;
      display: none;
    }
    .result a { color: #2b6cb0; word-break: break-all; }
    .small { color: #666; font-size: 13px; margin-top: 4px; }
  </style>
</head>
<body>
  <h1>Сокращатель ссылок</h1>

  <form id="form" class="row">
    <input id="url" type="text" placeholder="https://example.com/очень/длинный/путь" autocomplete="off">
    <button id="submit" type="submit">Сократить</button>
  </form>

  <div id="msg" class="msg"></div>

  <div id="result" class="result">
    <div>Короткая ссылка:</div>
    <div><a id="shortLink" href="#" target="_blank"></a></div>
    <div class="small">
      Оригинал: <span id="origUrl"></span>
    </div>
  </div>

  <script>
    const form   = document.getElementById('form');
    const input  = document.getElementById('url');
    const btn    = document.getElementById('submit');
    const msg    = document.getElementById('msg');
    const result = document.getElementById('result');
    const shortA = document.getElementById('shortLink');
    const origEl = document.getElementById('origUrl');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const url = input.value.trim();
      msg.className = 'msg';
      msg.textContent = '';
      result.style.display = 'none';

      if (!url) {
        msg.classList.add('error');
        msg.textContent = 'Введите ссылку';
        return;
      }

      btn.disabled = true;
      btn.textContent = '...';

      try {
        const resp = await fetch('/shorten', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url }),
        });

        const data = await resp.json();

        if (!resp.ok) {
          // FastAPI возвращает ошибки валидации в поле detail
          let text = 'Ошибка';
          if (Array.isArray(data.detail) && data.detail[0]?.msg) {
            text = data.detail[0].msg;
          } else if (typeof data.detail === 'string') {
            text = data.detail;
          }
          throw new Error(text);
        }

        shortA.href = data.short_url;
        shortA.textContent = data.short_url;
        origEl.textContent = data.original_url;
        result.style.display = 'block';
        input.value = '';
      } catch (err) {
        msg.classList.add('error');
        msg.textContent = err.message;
      } finally {
        btn.disabled = false;
        btn.textContent = 'Сократить';
      }
    });
  </script>
</body>
</html>
